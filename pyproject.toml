[project]
name = "adsb-co2"
version = "0.2.0"
description = "Aviation CO2 estimates for aircraft passing a fixed ADS-B receiver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openap==2.6.2",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
adsb-co2 = "adsb_co2.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
